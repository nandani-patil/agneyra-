<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background: #ffffff;
            width: 380px;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px;
            font-weight: 600;
        }

        h1 {
            margin: 10px 0;
            color: #333;
            font-size: 24px;
        }

        .username {
            color: #667eea;
            font-weight: 600;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-logout {
            background: #ff4d4d;
            color: white;
        }

        .btn-logout:hover {
            background: #e63939;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="avatar">
            {{ user[0]|upper }}
        </div>

        <h1>Welcome Back 👋</h1>
        <p>Hello <span class="username">{{ user }}</span>,<br>
           You are successfully logged in.</p>

        <a href="/logout" class="btn btn-logout">Logout</a>

        <div class="footer">
            © 2026 Flask Dashboard
        </div>
    </div>

</body>
</html>
